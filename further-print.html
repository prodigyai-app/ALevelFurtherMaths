<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Further Maths revision assessment</title><style>body{max-width:850px;margin:28px auto;padding:0 20px;font:16px/1.55 Georgia,serif;color:#111}h1{font-size:25px}article{break-inside:avoid;border-top:1px solid #aaa;margin-top:24px;padding-top:12px}.marks{float:right}.space{height:150px;border-bottom:1px dotted #ccc}button{padding:10px}li{margin:8px 0}@media print{button{display:none}.space{height:180px}body{margin:0;max-width:none}a{color:inherit}}</style><button onclick="print()">Print / save as PDF</button><main id="paper"></main><script src="further-tools.js"></script><script src="further-data.js"></script><script>
(()=>{const params=new URLSearchParams(location.search),p=FURTHER_COURSE.papers.find(p=>p.id===params.get('paper')),host=document.getElementById('paper'),T=FurtherTools;if(!p){host.textContent='Choose a printable assessment from the Further Maths course.';return;}const answers=params.get('answers')==='1';document.title=p.title+(answers?' · indicative scheme':' · questions');host.innerHTML='<h1>'+T.esc(p.title)+'</h1><p>Edexcel 9FM0 revision · '+p.marks+' marks · suggested '+p.minutes+' minutes</p><p>'+T.esc(p.reuse)+'</p><p>Original, unofficial Prodigy material. No official grade boundaries.</p>'+(answers?'':'<p>Name: __________________________ Date: ______________</p>');let total=0;const raw=h=>String(h).replace(/([a-zA-Z0-9π]+)\^\(([^()<>]*)\)/g,'$1<sup>$2</sup>');p.items.forEach(({lesson:id,q:k},i)=>{const l=FURTHER_COURSE.lessons.find(l=>l.id===id),Q=l.deep.exam[k],m=Q.parts.reduce((n,x)=>n+x.m,0);total+=m;const a=document.createElement('article');a.innerHTML='<h2>'+(i+1)+'. '+T.esc(l.title)+' <span class="marks">['+m+']</span></h2>'+raw(Q.stem||'')+Q.parts.map((x,j)=>'<p>'+(Q.parts.length>1?'('+'abcdefgh'[j]+') ':'')+raw(x.q)+' <span class="marks">['+x.m+']</span></p>'+(answers?'<ul>'+x.ms.map(([c,t])=>'<li><b>'+c+'</b> '+T.math(t)+'</li>').join('')+'</ul>':'<div class="space"></div>')).join('')+(answers?'<p>Credit equivalent valid methods.</p>':'');host.append(a);});if(total!==p.marks)throw Error('Assessment mark total mismatch');const end=document.createElement('p');end.textContent='End · Total '+total+' marks';host.append(end);})();
</script></html>
