<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Further Maths revision assessment</title><style>body{max-width:850px;margin:28px auto;padding:0 20px;font:16px/1.55 Georgia,serif;color:#111}h1{font-size:25px}article{break-inside:avoid;border-top:1px solid #aaa;margin-top:24px;padding-top:12px}.marks{float:right}.space{height:150px;border-bottom:1px dotted #ccc}button{padding:10px}li{margin:8px 0}@media print{button{display:none}.space{height:180px}body{margin:0;max-width:none}a{color:inherit}}</style><button onclick="print()">Print / save as PDF</button><main id="paper"></main><script src="further-tools.js"></script><script src="further-data.js"></script><script>
(()=>{const params=new URLSearchParams(location.search),p=FURTHER_COURSE.papers.find(p=>p.id===params.get('paper')),host=document.getElementById('paper'),T=FurtherTools;if(!p){host.textContent='Choose a printable assessment from the Further Maths course.';return;}const answers=params.get('answers')==='1';document.title=p.title+(answers?' · indicative scheme':' · questions');host.innerHTML='<h1>'+T.esc(p.title)+'</h1><p>Edexcel 9FM0 revision · '+p.marks+' marks · suggested '+p.minutes+' minutes</p><p>'+T.esc(p.reuse)+'</p><p>Original, unofficial Prodigy material. No official grade boundaries.</p>'+(answers?'':'<p>Name: __________________________ Date: ______________</p>');let total=0;p.lessons.forEach((id,i)=>{const l=FURTHER_COURSE.lessons.find(l=>l.id===id),q=l.practice,m=q.steps.length;total+=m;const a=document.createElement('article');a.innerHTML='<h2>'+(i+1)+'. '+T.esc(l.title)+' <span class="marks">['+m+']</span></h2><p>'+T.math(q.q)+'</p>'+(answers?'<ol>'+q.steps.map(s=>'<li>'+T.math(s)+'</li>').join('')+'</ol><p>Credit equivalent valid methods. A correct number alone does not establish the method marks.</p>':'<div class="space"></div>');host.append(a);});if(total!==p.marks)throw Error('Assessment mark total mismatch');const end=document.createElement('p');end.textContent='End · Total '+total+' marks';host.append(end);})();
</script></html>
